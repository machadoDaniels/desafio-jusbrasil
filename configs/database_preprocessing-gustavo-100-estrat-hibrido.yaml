database_preprocessing:
  input: outputs/preproc-100/desafio1_bracis_100_estrat.db
  output: outputs/preproc-100/desafio1_bracis_100_estrat_enriched_hibrido.db
  audit_dir: outputs/database-preprocessing/gustavo-100-estrat-hibrido
  model: google/gemma-4-12B-it-qat-w4a16-ct
  base_url: http://10.100.20.116:8412/v1
  api_key: $OPENAI_API_KEY
  temperature: 0
  top_p: null
  top_k: null
  reasoning_effort: null
  max_concurrency: 4
  max_retries: 3
  retry_delay_seconds: 1
  request_timeout_seconds: 120
  text_start_char_limit: 10000
  text_end_char_limit: 2000
  prompts:
    acordao: |-
      CONTEXTO
      Você enriquece a base canônica de acórdãos de um verificador de citações jurídicas. Cada valor que
      você devolver vira uma coluna consultada por SQL exato: um dígito trocado ou um número no campo
      errado faz uma citação verdadeira ser considerada inventada. Extraia somente o que está escrito no
      documento; não use conhecimento externo e não invente valores. Campos ausentes ficam nulos.

      O DOCUMENTO
      Você recebe o tribunal, o ano e o texto do acórdão. As chaves de identificação ficam no cabeçalho,
      nas primeiras linhas, num formato estável por tribunal:
      - STF: "<data> <turma> <CLASSE> <número> <ESTADO por extenso> RELATOR : ...". O número que segue a
        classe é o numero_classe_tribunal. O cabeçalho não traz CNJ do próprio processo.
      - STJ: "<CLASSE> Nº <número> - <UF> (<AAAA/NNNNNNN-D>) RELATOR : ...". O número após "Nº" é o
        numero_classe_tribunal; o que está entre parênteses é o numero_registro_tribunal. Sem CNJ próprio.
      - STM: "<CLASSE> Nº <CNJ>/<UF> RELATOR: ...". O CNJ é o do próprio processo.
      - TSE: "<CLASSE> Nº <CNJ> - <CIDADE> - <ESTADO por extenso> Relator: ...". Em acórdãos antigos o
        formato é "Nº <número> (<CNJ>)": o número antes dos parênteses é o numero_classe_tribunal.
      - TST: não há cabeçalho. O processo aparece como "TST-<SIGLAS>-<CNJ>" no corpo e no rodapé; as siglas
        entre "TST-" e o número são a cadeia recursal.

      CAMPOS
      - numero_processo_cnj: o número único nacional, formato NNNNNNN-DD.AAAA.J.TR.OOOO, devolvido com os
        20 dígitos e zeros à esquerda. Somente o do processo julgado. Números de outros processos citados no
        texto ("nos autos do processo n.", precedentes, processo de origem) não entram aqui. Nulo quando o
        cabeçalho não o traz, como no STF e no STJ.
      - numero_classe_tribunal: o número sequencial que acompanha a sigla da classe nas numerações próprias
        do STF e do STJ, somente dígitos, sem pontos. Nulo nos tribunais que identificam o processo só pelo CNJ.
      - numero_registro_tribunal: exclusivamente o registro do STJ no formato AAAA/NNNNNNN-D, devolvido com
        os 12 dígitos. Nulo em qualquer outro tribunal; nunca preenchido com CNJ, número de OAB ou data.
      - classe_processual: a classe do processo-base, a última da cadeia. Em "X no Y" é Y; em "X no Y no Z"
        é Z. Use uma das siglas permitidas. Classes eleitorais (REspe, AREspe) só existem no TSE; RR e ARR
        só no TST.
      - cadeia_recursal: todas as classes escritas no nome do processo, incluindo a principal, sem ordem e
        sem repetição. Só o que está escrito; não deduza recursos que o texto não menciona.
      - uf: sigla de dois caracteres do estado do processo, obtida do nome por extenso ou do sufixo após o
        número. Datas, números de OAB e nomes de cidade não são UF. Nula se o cabeçalho não trouxer estado.
    sumula: |-
      Você enriquece a base canônica de súmulas de um verificador de citações jurídicas. O título traz
      "Súmula n. <N> do <TRIBUNAL>" ou "Súmula Vinculante n. <N> do STF".
      - numero_sumula: o inteiro N, sem prefixo, pontuação ou texto adicional.
      - sumula_vinculante: true apenas quando a palavra "Vinculante" acompanha o título, o que só ocorre
        em súmulas do STF; false nas demais, inclusive súmulas comuns do próprio STF.
      Não use conhecimento externo; use nulo quando o texto não sustentar o campo.
    dispositivo: |-
      Você enriquece a base canônica de dispositivos de lei de um verificador de citações jurídicas. O
      título tem o formato "Artigo <N> d[oa] <DIPLOMA> nº <X>, de <data por extenso>" ou
      "Artigo <N> da Constituição Federal de <AAAA>".
      - numero_artigo: o identificador que segue "Artigo", como escrito, preservando ordinal e sufixos.
      - diploma: um dos valores permitidos. Os códigos são reconhecidos pela lei que os instituiu:
        Lei 10.406 → Código Civil; Lei 8.078 → Código de Defesa do Consumidor; Lei 13.105 → Código de
        Processo Civil; Decreto-Lei 3.689 → Código de Processo Penal; Decreto-Lei 1.001 → Código Penal
        Militar; Lei 4.737 → Código Eleitoral; Decreto-Lei 5.452 → Consolidação das Leis do Trabalho.
        "Lei Complementar" quando o título disser Lei Complementar; "Lei" somente para uma lei que não
        seja nenhum desses códigos.
      - numero_diploma: o número da norma, somente dígitos, sem pontos. Nunca o ano. Nulo para a
        Constituição Federal.
      - ano_diploma: o ano de quatro dígitos que encerra a data do título; para a Constituição, o ano que
        segue "Constituição Federal de".
      Não use conhecimento externo além dessa tabela; campos ausentes ficam nulos.
    acordao_fallback: |-
      CONTEXTO
      Você enriquece a base canônica de acórdãos de um verificador de citações jurídicas. Cada valor que
      você devolver vira uma coluna consultada por SQL exato: um dígito trocado ou um número no campo
      errado faz uma citação verdadeira ser considerada inventada. Extraia somente o que está escrito no
      documento; não use conhecimento externo e não invente valores. Campos ausentes ficam nulos.

      Este documento não tem um cabeçalho no formato esperado do tribunal. Um parser por regra tentou
      ler as chaves e devolveu apenas sugestões, em `chaves_do_cabecalho`, com a confiança de cada uma em
      `confianca_do_cabecalho`. Confirme cada sugestão no texto: mantenha a que estiver escrita no
      documento no campo certo, corrija a que estiver truncada ou no campo errado (por exemplo, um número
      solto que na verdade é o início de um CNJ com a formatação quebrada) e descarte a que não encontrar.
      Preencha os demais campos a partir do texto.

      CAMPOS
      - numero_processo_cnj: o número único nacional, formato NNNNNNN-DD.AAAA.J.TR.OOOO, devolvido com os
        20 dígitos e zeros à esquerda. Somente o do processo julgado, normalmente o primeiro número do
        cabeçalho, mesmo que o texto o traga com espaços, quebras de linha ou pontos fora do lugar. Números
        de outros processos citados ("nos autos do processo n.", precedentes, processo de origem) não entram.
      - numero_classe_tribunal: o número sequencial que acompanha a sigla da classe quando o tribunal usa
        numeração própria ("<CLASSE> Nº 12.345"), somente dígitos. Nulo quando o processo é identificado
        pelo CNJ.
      - numero_registro_tribunal: exclusivamente um registro no formato AAAA/NNNNNNN-D, devolvido com os
        12 dígitos. Nulo se não houver; nunca preenchido com CNJ, número de OAB ou data.
      - classe_processual: a classe do processo-base, a última da cadeia. Em "X no Y" é Y; em "X no Y no Z"
        é Z. Use uma das siglas permitidas; se nenhuma corresponder à classe escrita, null. Classes
        eleitorais (REspe, AREspe) só existem na Justiça Eleitoral; RR e ARR só na Justiça do Trabalho.
      - cadeia_recursal: todas as classes escritas no nome do processo, incluindo a principal, sem ordem e
        sem repetição. Só o que está escrito; não deduza recursos que o texto não menciona.
      - uf: sigla de dois caracteres do estado do processo, obtida do nome por extenso, do sufixo após o
        número ou da comarca. Datas, números de OAB e nomes de cidade não são UF. Nula se o texto não
        trouxer estado.
    acordao_semantico: |-
      CONTEXTO
      Você enriquece a base canônica de acórdãos de um verificador de citações jurídicas. As chaves de
      busca (número CNJ, número de classe, registro e UF) já foram extraídas do cabeçalho por regra e
      vêm em `chaves_do_cabecalho`; não as repita nem as corrija. Sua tarefa é ler o cabeçalho e devolver
      apenas a classificação processual, que uma etapa posterior usa para desempatar registros com o
      mesmo número. Não use conhecimento externo, não invente valores e não avalie o mérito do acórdão.

      ONDE A CLASSE ESTÁ, POR TRIBUNAL
      - STF, STJ, STM e TSE: no nome do processo, no início do cabeçalho ("<CLASSE> Nº ..."), com os
        recursos incidentais encadeados por "no", "na", "nos" ("X no Y no Z").
      - TST: nas siglas do código "TST-<SIGLAS>-<número>", uma sigla por recurso, separadas por hífen.
      - Outros tribunais: como no STJ, no nome do processo no início do cabeçalho.

      CAMPOS
      - classe_processual: a classe do processo-base, isto é, a última da cadeia. Em "X no Y" é Y; em
        "X no Y no Z" é Z; no código do TST, é a última sigla. Escolha entre os valores permitidos; se
        nenhum corresponder, null. Classes eleitorais (REspe, AREspe) só existem no TSE; RR e ARR só no TST.
      - cadeia_recursal: todas as classes explicitamente nomeadas no nome ou no código do processo,
        incluindo a classe principal, sem ordem e sem repetição. Só o que está escrito; não deduza
        recursos que o texto não menciona.
      - uf: preencha somente se `chaves_do_cabecalho.uf` vier nulo e o cabeçalho trouxer o estado por
        extenso ou pela sigla; caso contrário, null.
  modo_chaves: hibrido
  janela_cabecalho_chars: 500
  janela_tst_chars: 1500
  janela_fallback_chars: 3000
  few_shot_path: configs/few_shot_sintetico.json
