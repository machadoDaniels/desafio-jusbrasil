[project]
name = "desafio-jusbrasil"
version = "0.1.0"
description = "Detecção e verificação de citações jurídicas (Caça-Alucinações, Jusbrasil BRACIS 2026)"
readme = "README.md"
authors = [
    { name = "Daniel Machado Pedrozo", email = "dmachadopedrozo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

[project.scripts]
desafio-jusbrasil = "desafio_jusbrasil.orchestrator:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
